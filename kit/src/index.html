<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=540,height=960"><title>آیدا — ریلز اختصاصی</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:800;font-display:block;src:url(/assets/fonts/Vazirmatn-ExtraBold.woff2)}
@font-face{font-family:Vazirmatn;font-weight:500;font-display:block;src:url(/assets/fonts/Vazirmatn-Medium.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:540px;height:960px;background:#201c35}body{font-family:Vazirmatn,sans-serif;color:#fff4eb}
#stage{width:540px;height:960px;position:relative;overflow:hidden}#scene,svg{width:100%;height:100%;position:absolute;inset:0}#cap{position:absolute;top:178px;left:35px;right:35px;text-align:center;font-weight:800;font-size:34px;line-height:1.7;z-index:5;filter:drop-shadow(0 2px 4px #24142b88)}.w{display:inline-block;padding:0 5px;border-radius:9px;white-space:nowrap}.w.on{background:#f5b73b;color:#342348}.line{display:block;min-height:58px}#eyebrow{position:absolute;top:137px;width:100%;text-align:center;color:#dfc7e7;font-size:13px;font-weight:500;letter-spacing:1px;z-index:5}#wm{position:absolute;left:34px;top:741px;font-size:15px;font-weight:500;opacity:.7;z-index:6;direction:ltr}#counter{position:absolute;right:34px;top:741px;font-size:13px;color:#ddc3dd;z-index:6}#track{position:absolute;top:724px;left:35px;right:35px;height:2px;display:flex;gap:6px;direction:ltr;z-index:6}.dot{height:2px;flex:1;border-radius:2px;background:#d2b4d22e}.fill{height:100%;background:#f5ca83;border-radius:2px}
body.journey #wm,body.journey #counter{background:#403b56a8;border-radius:6px;padding:2px 7px;color:#fff1db;opacity:.95}body.journey #stage[data-tone="warm"] #cap{color:#53435e;filter:drop-shadow(0 1px 1px #fff6e5aa)}

</style><script type="importmap">{"imports":{"three":"/render/node_modules/three/build/three.module.js","three/addons/":"/render/node_modules/three/examples/jsm/","postprocessing":"/render/node_modules/postprocessing/build/index.js"}}</script></head><body><div id="stage"><div id="scene"></div><div id="eyebrow"></div><div id="cap"></div><div id="track"></div><div id="wm"></div><div id="counter"></div></div>
<script>
'use strict';
const REG={};window.registerScene=(id,r)=>{REG[id]=r};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SC,BR,S=[],TOT=0,cur=null;
window.__seek=function(t){
 if(!S.length)return;t=Math.max(0,Math.min(TOT,t));
 const end=t>=TOT-SC.endCardSeconds;
 const s=end?{id:'__endcard',start:TOT-SC.endCardSeconds,dur:SC.endCardSeconds}:S.find(s=>t<s.start+s.dur)||S.at(-1);
 const lt=t-s.start,p=Math.min(1,lt/s.dur),el=document.getElementById('scene');
 if(!REG[s.id])throw new Error('Missing renderer: '+s.id);
 if(cur!==s.id){cur=s.id;REG[s.id].mount(el,s);}
 REG[s.id].update(el,p,lt,BR);
 const cap=document.getElementById('cap');
 if(end)cap.innerHTML='';else{
  const active=s.words.findIndex(w=>lt>=w.t0&&lt<w.t1);
  let wordIndex=active<0?(lt<s.words[0].t0?0:s.words.length-1):active;
  const page=s.pages.find(page=>wordIndex>=page.from&&wordIndex<page.to)||s.pages.at(-1);
  cap.innerHTML=page.lines.map(line=>'<span class="line">'+line.map(i=>{
   const w=s.words[i],pop=active===i?1+.07*Math.sin(Math.min(1,(lt-w.t0)/.13)*Math.PI):1;
   return `<span class="w${active===i?' on':''}" style="transform:scale(${pop})">${escapeHTML(w.w)}</span>`;
  }).join(' ')+'</span>').join('');
 }
 const idx=end?S.length-1:S.indexOf(s);
 document.getElementById('eyebrow').textContent=end?'AYDA · NAIL ROOM':['trailer','sequel','journey','macro','education'].includes(SC.renderer)?'':idx===0?'قصه‌های کوچیکِ میز ناخن':'پنج جمله، یک عالمه صبر';
 if(SC.renderer==='journey')document.getElementById('stage').dataset.tone=['hook','tired','break','shoe'].includes(s.id)?'cool':'warm';
 document.getElementById('wm').textContent=BR.handle;
 document.getElementById('counter').textContent=end?'ادامه دارد…':`${String(S.length).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])} / ${String(idx+1).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}`;
 document.getElementById('track').innerHTML=S.map((_,i)=>`<div class="dot"><div class="fill" style="width:${i<idx?100:i===idx?p*100:0}%"></div></div>`).join('');
 // Final 0.3 seconds lands on the exact opening pose, including typography.
 if(end&&p>=.98){cur=null;window.__seek(0);return;}
 window.__state={scene:s.id,localTime:lt,progress:p,activeWord:end?null:s.words.find(w=>lt>=w.t0&&lt<w.t1)?.w};
};
</script><script>
window.__ready=(async()=>{
 [SC,BR]=await Promise.all(['/input/scenario.json','/brand.json'].map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+': '+r.status);return r.json()}));
 if(!['studio','trailer','sequel','journey','macro','education'].includes(SC.renderer||'studio'))throw new Error('Unknown scene module');
 if(SC.renderer==='macro')await import('/src/scenes/macro.js');else for(const name of SC.renderer==='education'?['studio','education']:SC.renderer==='journey'?['trailer','sequel','journey']:SC.renderer==='sequel'?['trailer','sequel']:[SC.renderer||'studio'])await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/src/scenes/'+name+'.js';script.onload=resolve;script.onerror=reject;document.head.append(script);});
 if(SC.renderer==='macro')document.body.classList.add('macro');document.title=SC.title+' — آیدا نیل‌روم';if(SC.renderer==='journey')document.body.classList.add('journey');
 await Promise.all([document.fonts.load('800 34px Vazirmatn'),document.fonts.load('500 15px Vazirmatn')]);await document.fonts.ready;
 let TM={};const r=await fetch(SC.reelId&&SC.reelId!=='01'?`/out/${SC.reelId}/timing.json`:'/out/timing.json');if(r.ok)TM=await r.json();
 let t=0;SC.endCardSeconds??=3;
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font='800 34px Vazirmatn';
 for(const scene of SC.scenes){
  const m=TM[scene.id];
  if(['trailer','sequel','journey','macro','education'].includes(SC.renderer)&&m&&m.words.map(w=>w.w).join(' ')!==scene.text.split(/\s+/).join(' '))throw new Error('Stale word timing for '+scene.id+'; rerun audio generation');
  const words=m?.words||scene.words||scene.text.split(/\s+/).map((w,i)=>({w,t0:.15+i*BR.wordDuration,t1:.15+(i+1)*BR.wordDuration}));
  const s={...scene,words,start:t,dur:m?.dur||scene.dur||words.at(-1).t1+(SC.hold??.8),pages:[]};
  // Measured 2-line pages. Keep a phrase together, but never overflow 470 CSS px.
  let from=0;while(from<words.length){let lines=[[]],width=0,j=from;
   for(;j<words.length&&j<from+5;j++){
    const w=ctx.measureText(words[j].w).width+22;
    if(width+w>460&&lines.at(-1).length){if(lines.length===2)break;lines.push([]);width=0;}
    lines.at(-1).push(j);width+=w;
   }
   if(j===from)throw new Error('Unbreakable caption');s.pages.push({from,to:j,lines});from=j;
  }
  t+=s.dur;S.push(s);
 }
 TOT=Math.round((t+SC.endCardSeconds)*1e6)/1e6;window.__duration=TOT;window.__scenes=S;window.__brand=BR;window.__seek(0);
})();
</script></body></html>
